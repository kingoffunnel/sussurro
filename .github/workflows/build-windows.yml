name: "build-windows"

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: sussurro-v__VERSION__
          releaseName: "Sussurro v__VERSION__"
          releaseBody: "Instalador para Windows. Baixe o arquivo .msi ou -setup.exe abaixo."
          releaseDraft: false
          prerelease: false

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sussurro-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
